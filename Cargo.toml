[package]
name = "simple-alert"
version = "0.1.0"
edition = "2024"
description = "Posts alerts from services on a personal server to a Telegram channel."
license = "MIT"
repository = "https://github.com/zacharysiegel/simple-alert"

[dependencies]
base64 = "0.22.*"
clap = { version = "4.6.*", features = ["derive"] }
minimer = "2.2.*"
rpassword = "7.5.*"
secr = "1.2.*"
serde = { version = "1.0.*", features = ["derive"] }
serde_json = "1.0.*"
toml = "1.2.*"
ureq = { version = "3.5.*", default-features = false, features = ["rustls", "json"] }
